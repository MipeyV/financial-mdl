[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "financial-mdl"
version = "0.1.0"
description = "Reproducible financial forecasting and MDL research contracts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2",
  "pyarrow>=19,<24",
  "plotly>=6,<7",
]

[project.optional-dependencies]
tracking = ["mlflow>=3,<4"]
market = ["yfinance>=0.2.65,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
financial-mdl = "financial_mdl.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["tracking: optional MLflow integration test"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
